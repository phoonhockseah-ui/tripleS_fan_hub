<style>
/* Layout: sticky top bar with a Fan App / Game Hub switch, a scrolling sub-nav, then one view at a time. A 24-color spectrum strip is the recurring motif. */
:root{
  --bg:#F5F4F8;--surface:#FFFFFF;--surface2:#ECEAF2;--fg:#17151F;--muted:#625F72;--line:#D9D6E3;
  --accent:#1F5BFF;--accent-fg:#FFFFFF;--good:#17824C;--bad:#C23A3A;--warn:#B77700;
  --font-d:'Bricolage Grotesque',system-ui,sans-serif;--font-b:'DM Sans',system-ui,sans-serif;--font-m:'DM Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#13121B;--surface:#1C1B27;--surface2:#262434;--fg:#F0EEF8;--muted:#A5A2B8;--line:#34324A;
  --accent:#7BA0FF;--accent-fg:#0C1030;--good:#4CC585;--bad:#F07A7A;--warn:#E6B04A;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13121B;--surface:#1C1B27;--surface2:#262434;--fg:#F0EEF8;--muted:#A5A2B8;--line:#34324A;
  --accent:#7BA0FF;--accent-fg:#0C1030;--good:#4CC585;--bad:#F07A7A;--warn:#E6B04A;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-b);font-size:16px;line-height:1.5;padding-block:0 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
h1,h2,h3{font-family:var(--font-d);line-height:1.1;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(2rem,6vw,3.4rem);font-weight:800}
h2{font-size:clamp(1.4rem,3.4vw,2rem);font-weight:700}
h3{font-size:1.1rem;font-weight:700}
p{margin:0}
a{color:var(--accent)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1100px;margin-inline:auto}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding-block:10px 0}
.top .row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-d);font-weight:800;font-size:1.15rem}
.spec{display:inline-flex;height:18px;width:72px;border-radius:3px;overflow:hidden;flex:none}
.spec i{flex:1}
.seg{display:flex;background:var(--surface2);border-radius:999px;padding:3px}
.seg a{padding:6px 16px;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:700;font-size:.9rem}
.seg a.on{background:var(--accent);color:var(--accent-fg)}
.sub{display:flex;gap:2px;overflow-x:auto;padding-block:8px 0;scrollbar-width:thin}
.sub a{flex:none;padding:8px 12px;text-decoration:none;color:var(--muted);font-weight:500;font-size:.92rem;border-bottom:3px solid transparent}
.sub a.on{color:var(--fg);border-bottom-color:var(--accent);font-weight:700}
main{padding-block:28px}
.page-head{display:grid;gap:10px;margin-bottom:24px;max-width:70ch}
.page-head p{color:var(--muted)}
.eyebrow{font-family:var(--font-m);font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr))}
.grid.wide{grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.card.flat{background:transparent}
.stack{display:grid;gap:12px}
.cols{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.av{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;font-family:var(--font-d);font-weight:800;object-fit:cover;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.14)}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:.8rem;background:var(--surface2);white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
.mono{font-family:var(--font-m)}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 16px;font-weight:700}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.btn:disabled{opacity:.5;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:.88rem;font-weight:500}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
input[type=search],input[type=text]{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-width:0;width:100%}
.hero{display:grid;gap:18px;padding-block:8px 28px}
.hero .lead{font-size:1.15rem;max-width:56ch;color:var(--muted)}
.bigspec{display:flex;height:44px;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.bigspec i{flex:1}
.tl{display:grid;gap:14px}
.tl .it{display:grid;grid-template-columns:110px 1fr;gap:14px;align-items:start}
.tl .when{font-family:var(--font-m);font-size:.8rem;color:var(--muted);padding-top:4px}
@media (max-width:560px){.tl .it{grid-template-columns:1fr;gap:4px}}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:480px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);font-size:.92rem;vertical-align:top}
th{font-family:var(--font-m);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:500}
ol.tracks{margin:8px 0 0;padding-left:1.4em;columns:2 200px;font-size:.92rem}
.avs{display:flex;flex-wrap:wrap;gap:6px}
.note{border-left:3px solid var(--line);padding:4px 0 4px 12px;color:var(--muted);font-size:.88rem}
/* games */
.gcard{display:grid;gap:8px;text-decoration:none;color:inherit;transition:transform .15s,border-color .15s}
.gcard:hover{transform:translateY(-2px);border-color:var(--accent)}
.gcard .ico{height:56px;border-radius:10px;display:flex;overflow:hidden}
.gcard .ico i{flex:1}
.scorebar{display:flex;gap:16px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:14px}
.opts{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));margin-top:14px}
.opt{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;text-align:left;font-weight:500}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 16%,var(--surface))}
.opt.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--surface))}
.opt:disabled{cursor:default}
.prompt{font-family:var(--font-d);font-size:clamp(1.2rem,3vw,1.6rem);font-weight:700;line-height:1.25}
.media{margin-top:14px;display:flex;justify-content:center}
.frame{width:min(100%,520px);aspect-ratio:16/9;border-radius:12px;border:1px solid var(--line);display:flex;align-items:flex-end;padding:10px;font-family:var(--font-m);font-size:.72rem;color:#fff;overflow:hidden}
.frame img{width:100%;height:100%;object-fit:cover;border-radius:8px}
.swatch{width:min(100%,260px);aspect-ratio:1;border-radius:20px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.fb{margin-top:14px;padding:10px 14px;border-radius:10px;background:var(--surface2);font-size:.95rem}
.board{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;width:min(100%,460px);margin-inline:auto}
.tile{aspect-ratio:1;border-radius:10px;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--font-d);font-weight:800;font-size:clamp(1rem,4.6vw,1.5rem);line-height:1;box-shadow:inset 0 0 0 1px rgba(0,0,0,.14);min-width:0}
.tile small{font-family:var(--font-b);font-weight:500;font-size:clamp(.5rem,2vw,.68rem);margin-top:3px;opacity:.85}
.tile.blank{background:var(--surface2);box-shadow:none;cursor:default}
.slots{display:flex;gap:8px;flex-wrap:wrap}
.slot{width:62px;height:62px;border-radius:12px;border:2px dashed var(--line);display:flex;align-items:center;justify-content:center;background:var(--surface);padding:0}
.slot.f{border-style:solid}
.cand{display:flex;flex-direction:column;align-items:center;gap:4px;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 6px;width:78px;font-size:.72rem}
.cand:disabled{opacity:.35}
.hist{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.pegs{display:grid;grid-template-columns:repeat(2,14px);gap:4px;margin-left:auto}
.peg{width:14px;height:14px;border-radius:50%;border:2px solid var(--line)}
.peg.b{background:var(--fg);border-color:var(--fg)}
.peg.w{background:var(--surface);border-color:var(--fg)}
.wall{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(54px,1fr))}
.wall button{border:0;background:none;padding:0;border-radius:50%;aspect-ratio:1;display:flex}
.wall button .av{width:100%;height:100%;font-size:clamp(.8rem,3vw,1.05rem)}
.wall button.bad{animation:shk .25s}
@keyframes shk{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@media (prefers-reduced-motion:reduce){.wall button.bad{animation:none}.gcard{transition:none}}
.timer{font-family:var(--font-m);font-size:1.6rem;font-weight:500}
.timer.low{color:var(--bad)}
.clue{padding:12px 14px;border-radius:10px;background:var(--surface2);display:flex;gap:10px;align-items:center}
.clue b{font-family:var(--font-m);font-size:.75rem;color:var(--muted);flex:none}
.shelf{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr))}
.shelf .card{padding:12px;display:grid;gap:8px;justify-items:center;text-align:center}
.shelf .sw{width:100%;aspect-ratio:1.6;border-radius:10px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.14)}
.up{display:grid;gap:8px;justify-items:center;text-align:center;font-size:.82rem}
.up input{max-width:100%;font-size:.75rem}
#modal{position:fixed;inset:0;z-index:50;background:rgba(8,8,14,.82);display:flex;align-items:center;justify-content:center;padding:16px}
#modal[hidden]{display:none}
#modal .box{width:min(100%,900px);display:grid;gap:10px;color:#fff}
#modal .vid{aspect-ratio:16/9;width:100%;background:#000;border-radius:12px;overflow:hidden}
#modal iframe{width:100%;height:100%;border:0;display:block}
#modal .bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
#modal a{color:#fff}
#modal .btn{color:var(--fg)}
.logo{width:38px;height:38px;border-radius:10px;flex:none;display:block}
.herologo{width:clamp(84px,18vw,128px);height:auto;border-radius:20px;display:block}
footer{max-width:1100px;margin:40px auto 0;color:var(--muted);font-size:.82rem;border-top:1px solid var(--line);padding-top:16px}
</style>

 if(Q.i>=Q.qs.length){const k='best-'+Q.id,b=LS.get(k,0);if(Q.score>b)LS.set(k,Q.score);

 G.innerHTML=`<div class="card"><div class="scorebar"><span class="mono small muted">Question ${Q.i+1} of ${Q.qs.length}</span><span class="mono small">Score ${Q.score}</span></div>
 <div class="prompt">${q.p}</div>${q.media?`<div class="media">${q.media}</div>`:''}
 <div class="opts" role="group">${q.o.map((o,i)=>`<button class="opt ${p!=null?(i===q.c?'ok':(i===p?'no':'')):''}" data-opt="${i}" ${p!=null?'disabled':''}>${o}</button>`).join('')}</div>

function build10(gens){const out=[],seen=new Set();let guard=0;
 while(out.length<10&&guard++<400){const q=rnd(gens)();if(q&&!seen.has(q.p)){seen.add(q.p);out.push(q)}}return out}

/* SlideSSS */
let SL=null;
function slInit(){const b=[...Array(24).keys()].map(i=>i+1).concat(0);let z=24,last=-1;
 for(let k=0;k<400;k++){const r=Math.floor(z/5),c=z%5,nb=[];if(r>0)nb.push(z-5);if(r<4)nb.push(z+5);if(c>0)nb.push(z-1);if(c<4)nb.push(z+1);
  const ch=rnd(nb.filter(x=>x!==last).length?nb.filter(x=>x!==last):nb);b[z]=b[ch];b[ch]=0;last=z;z=ch}
 if(b.every((v,i)=>v===(i+1)%25))return slInit();
 SL={b,moves:0,t0:null,time:0,won:false};stopTimer();slDraw()}
function slSolved(b){for(let i=0;i<24;i++)if(b[i]!==i+1)return false;return b[24]===0}
function slMove(i){if(SL.won)return;const b=SL.b,z=b.indexOf(0),ri=Math.floor(i/5),ci=i%5,rz=Math.floor(z/5),cz=z%5;
 if(i===z||(ri!==rz&&ci!==cz))return;
 const step=ri===rz?(i<z?1:-1):(i<z?5:-5);let p=z;while(p!==i){b[p]=b[p-step];p-=step}b[i]=0;SL.moves++;
 if(!SL.t0){SL.t0=Date.now();TM=setInterval(()=>{SL.time=Math.floor((Date.now()-SL.t0)/1000);const e=$('#slT');if(e)e.textContent=SL.time+'s'},500)}
 if(slSolved(b)){SL.won=true;stopTimer();SL.time=Math.floor((Date.now()-SL.t0)/1000);const bst=LS.get('best-slide',null);if(bst==null||SL.moves<bst)LS.set('best-slide',SL.moves)}
 slDraw()}
function slDraw(){const G=$('#game');if(!G)return;
 G.innerHTML=`<div class="card"><div class="scorebar"><span class="mono">Moves ${SL.moves}</span><span class="mono" id="slT">${SL.time}s</span><span class="mono small muted">${bestText('slide')}</span></div>
 <div class="board" role="grid">${SL.b.map((v,i)=>v?`<button class="tile" data-tile="${i}" style="background:${MB(v).c};color:${ink(MB(v).c)}" aria-label="S${v}">S${v}<small>${esc(MB(v).name)}</small></button>`:`<div class="tile blank"></div>`).join('')}</div>
 ${SL.won?`<div class="fb" role="status"><b>Solved in ${SL.moves} moves and ${SL.time} seconds.</b> S1 to S24 are all in order.</div>`:`<p class="small muted" style="margin-top:12px;text-align:center">Tap a tile in the same row or column as the gap to slide it. Put S1 to S24 in order, with the gap last.</p>`}
 <div style="text-align:center;margin-top:12px"><button class="btn primary" data-slnew>New shuffle</button></div></div>`}
function pSlide(){setTimeout(slInit,0);return gHead('SlideSSS','A 5x5 sliding puzzle with S1 to S24 and one gap. Put every member in order. A step up from the S1-S8 and S1-S15 puzzles.')+'<div id="game"></div>'}

/* Match 4 */
let MM=null;
function m4Init(){const pool=shuffle(M).slice(0,8);MM={pool,secret:shuffle(pool).slice(0,4),cur:[],hist:[],over:false,win:false};m4Draw()}
function m4Fb(g,s){let b=0,w=0;g.forEach((x,i)=>{if(x===s[i])b++;else if(s.includes(x))w++});return{b,w}}
function m4Draw(){const G=$('#game');if(!G)return;
 const pegs=h=>{const a=[...Array(h.b).fill('b'),...Array(h.w).fill('w')];while(a.length<4)a.push('');return a.map(c=>`<span class="peg ${c}"></span>`).join('')};
 G.innerHTML=`<div class="cols"><div class="card stack"><div class="scorebar" style="margin:0"><b>Candidates</b><span class="mono small muted">${MM.hist.length} / 10 guesses</span></div>
  <div class="avs" style="gap:8px">${MM.pool.map((m,i)=>`<button class="cand" data-cand="${i}" ${MM.cur.includes(m.n)||MM.over?'disabled':''}>${av(m,40)}${esc(m.name)}</button>`).join('')}</div>
  <b style="margin-top:6px">Your guess</b><div class="slots">${[0,1,2,3].map(i=>MM.cur[i]?`<button class="slot f" data-slot="${i}" aria-label="Remove ${esc(MB(MM.cur[i]).name)}">${av(MB(MM.cur[i]),46)}</button>`:`<span class="slot"></span>`).join('')}</div>
  <div><button class="btn primary" data-m4go ${MM.cur.length<4||MM.over?'disabled':''}>Submit guess</button> <button class="btn" data-m4new>New game</button></div>
  <p class="small muted">Four different members, in order. Black peg: right member, right position. White peg: right member, wrong position.</p>
  ${MM.over?`<div class="fb" role="status"><b>${MM.win?'You cracked it in '+MM.hist.length+' guesses.':'Out of guesses.'}</b> The sequence was ${MM.secret.map(n=>esc(MB(n).name)).join(', ')}.</div>`:''}</div>
 <div class="card"><b>History</b>${MM.hist.length?MM.hist.map((h,i)=>`<div class="hist"><span class="mono small muted">${i+1}</span>${h.g.map(n=>av(MB(n),34)).join('')}<span class="pegs">${pegs(h.f)}</span></div>`).join(''):'<p class="muted small" style="margin-top:8px">Your guesses appear here.</p>'}</div></div>`}
function pM4(){setTimeout(m4Init,0);return gHead('Match 4','Find the four hidden members as a sequence. Each guess gets black and white peg feedback.')+'<div id="game"></div>'}

/* Find S */
let FS=null;
function fsAvatars(){return FS.tiles.map((m,i)=>`<button data-ft="${i}" aria-label="Member">${av(m,60)}</button>`).join('')}
function fsWall(){const lvl=FS.lvl,cnt=Math.min(8+4*(lvl-1),88),t=rnd(M);FS.target=t;
 FS.tiles=shuffle([t,...Array.from({length:cnt-1},()=>rnd(M.filter(x=>x!==t)))])}
function fsDraw(){const G=$('#game');if(!G)return;
 if(!FS.run){const b=LS.get('best-finds',0);
  G.innerHTML=`<div class="card stack" style="text-align:center;justify-items:center">${FS.over?`<span class="eyebrow">Time</span><h2>${FS.found} found</h2><p class="muted">Best: ${b}</p>`:'<h2>Ready?</h2><p class="muted" style="max-width:48ch">A member is hiding on the wall. Find as many as you can in 60 seconds. Every correct tap adds more members to the wall. A wrong tap costs 3 seconds.</p>'}<button class="btn primary" data-fsgo>${FS.over?'Play again':'Start'}</button></div>`;return}
 G.innerHTML=`<div class="card"><div class="scorebar"><div style="display:flex;gap:10px;align-items:center">${av(FS.target,52)}<div><div class="small muted">Find</div><b>${esc(FS.target.name)}</b></div></div><span class="mono">Found ${FS.found}</span><span class="timer" id="fsT">${Math.ceil(FS.time)}</span></div><div class="wall" id="wall">${fsAvatars()}</div></div>`}
function fsStart(){FS={run:true,over:false,found:0,lvl:1,time:60};fsWall();stopTimer();TM=setInterval(fsTick,100);fsDraw()}
function fsTick(){FS.time-=.1;const e=$('#fsT');if(e){e.textContent=Math.max(0,Math.ceil(FS.time));e.classList.toggle('low',FS.time<=10)}if(FS.time<=0)fsEnd()}
function fsEnd(){stopTimer();FS.run=false;FS.over=true;const b=LS.get('best-finds',0);if(FS.found>b)LS.set('best-finds',FS.found);fsDraw()}
function pFind(){FS={run:false,over:false,found:0,lvl:1,time:60};setTimeout(fsDraw,0);return gHead('Find S','A member is hiding on the photo wall. Find as many as you can in 60 seconds. Wrong taps cost 3 seconds, and each correct answer makes the wall bigger.')+'<div id="game"></div>'+`<p class="note" style="margin-top:14px">${hasPhotos()?'Using your photos from the Photo Studio.':'The wall uses color avatars. Add photos in the <a href="#photos">Photo Studio</a> for a real photo wall.'}</p>`}

/* Reveal */
let RV=null;
const nrm=s=>s.toLowerCase().replace(/[^a-z]/g,'');
function cluesOf(m){const u=unitOf(m);return[
 m.bd?`Born in <b>${m.bd.slice(0,4)}</b>.`:'One of the <b>final four members</b>, revealed in April 2024.',
 `Her official color is <b>${esc(m.cn)}</b> <i class="dot" style="background:${m.c}"></i>.`,
 `In msnz she is in <b>${u.name}</b>${m.lead?' and she is the leader':''}.`,
 `Nationality: <b>${esc(m.nat)}</b>.`,
 `She is <b>S${m.n}</b>, the ${m.n}${m.n%10===1&&m.n!==11?'st':m.n%10===2&&m.n!==12?'nd':m.n%10===3&&m.n!==13?'rd':'th'} member revealed.`]}
function rvInit(){RV={order:shuffle(M),i:0,k:1,score:0,msg:'',done:false,solved:false,reveal:false};rvDraw()}
function rvDraw(){const G=$('#game');if(!G)return;
 if(RV.done){const b=LS.get('best-reveal',0);if(RV.score>b)LS.set('best-reveal',RV.score);
  G.innerHTML=`<div class="card stack" style="text-align:center;justify-items:center"><span class="eyebrow">All 24 done</span><h2>${RV.score} / 120 points</h2><p class="muted">Best: ${Math.max(b,RV.score)}</p><button class="btn primary" data-rvnew>Play again in a new order</button></div>`;return}
 const m=RV.order[RV.i],cl=cluesOf(m);
 G.innerHTML=`<div class="card stack"><div class="scorebar" style="margin:0"><span class="mono small muted">Member ${RV.i+1} of 24</span><span class="mono small">Points ${RV.score}</span></div>
 <div class="stack">${cl.slice(0,RV.k).map((c,i)=>`<div class="clue"><b>CLUE ${i+1}</b><span>${c}</span></div>`).join('')}</div>
 ${RV.solved||RV.reveal?`<div class="fb" role="status"><div style="display:flex;gap:12px;align-items:center">${av(m,56)}<div><b>${RV.solved?'Correct':'It was'} ${esc(m.name)}</b> (${esc(m.full)})<br><span class="small muted">${RV.msg}</span></div></div></div><div><button class="btn primary" data-rvnext>${RV.i===23?'Finish':'Next member'}</button></div>`
 :`<form id="rvf" class="stack" autocomplete="off"><label for="rvin" class="small muted">Who is she? First try is worth 5 points, and each extra clue lowers it.</label><div style="display:flex;gap:8px"><input type="text" id="rvin" list="rvl" placeholder="Type a member name" aria-label="Member name"><button class="btn primary" type="submit">Guess</button></div><datalist id="rvl">${M.map(x=>`<option value="${esc(x.name)}">`).join('')}</datalist>${RV.msg?`<div class="small" style="color:var(--bad)" role="alert">${RV.msg}</div>`:''}</form>`}</div>`}
function rvGuess(v){const m=RV.order[RV.i],g=nrm(v);if(!g)return;
 if(g===nrm(m.name)||g===nrm(m.full)){const pts=Math.max(5-(RV.k-1),1);RV.score+=pts;RV.solved=true;RV.msg=`+${pts} point${pts>1?'s':''}${RV.k===1?' for getting it on the first try':''}.`}
 else if(RV.k>=5){RV.reveal=true;RV.msg='No points this time.'}
 else{RV.k++;RV.msg='Not her. Here is another clue.'}
 rvDraw();const i=$('#rvin');if(i)i.focus()}
function pReveal(){setTimeout(rvInit,0);return gHead('Reveal','A clue about a member. Guess right on the first try and move on. Guess wrong and you get another clue before you can continue. All 24 members, in random order.')+'<div id="game"></div>'}

/* Photo Studio */
function pPhotos(){
 return gHead('Photo Studio','Add your own member photos and MV frames. They stay in this browser only and are never uploaded. Use images you have the right to use.')+
 `<div class="note" style="margin-bottom:16px">Photos power Who Who and Find S. MV frames show up in MV Quiz and on the MV page.</div>
 <div style="margin-bottom:14px"><button class="btn" data-phclear>Remove all photos</button> <span id="phmsg" class="small muted" role="status"></span></div>
 <h2 style="margin-bottom:12px">Members</h2><div class="shelf">${M.map(m=>`<div class="card up"><span id="pv-m${m.n}">${av(m,72)}</span><b>S${m.n} ${esc(m.name)}</b><input type="file" accept="image/*" data-ph="m${m.n}" aria-label="Photo for ${esc(m.name)}"></div>`).join('')}</div>
 <h2 style="margin:28px 0 12px">MV frames</h2><div class="shelf">${MV.map(v=>`<div class="card up"><div class="frame" id="pv-mv${v.id}" style="background:${grad(v.mem)}">${PH['mv:'+v.id]?`<img src="${PH['mv:'+v.id]}" alt="">`:''}</div><b>${esc(v.t)}</b><input type="file" accept="image/*" data-ph="mv:${v.id}" aria-label="Frame for ${esc(v.t)}"></div>`).join('')}</div>`}
function phSave(key,file){const msg=$('#phmsg');const fr=new FileReader();
 fr.onload=()=>{const im=new Image();im.onload=()=>{const mv=key.startsWith('mv:'),W=mv?480:200,H=mv?270:200,c=document.createElement('canvas');c.width=W;c.height=H;
  const s=Math.max(W/im.width,H/im.height),w=im.width*s,h=im.height*s;c.getContext('2d').drawImage(im,(W-w)/2,(H-h)/2,w,h);
  PH[key]=c.toDataURL('image/jpeg',.8);const ok=LS.set('sssPhotos',PH);if(msg)msg.textContent=ok?'Saved in this browser.':'Browser storage is full or blocked. The photo works until you leave this page.';
  const id=key.startsWith('mv:')?'pv-mv'+key.slice(3):'pv-'+key;const el=document.getElementById(id);
  if(el){if(mv)el.innerHTML=`<img src="${PH[key]}" alt="">`;else el.innerHTML=av(MB(+key.slice(1)),72)}};im.src=fr.result};
 fr.readAsDataURL(file)}

/* ---------- router ---------- */
const R={
 home:['fan','Home',pHome],members:['fan','Members',pMembers],units:['fan','Units',pUnits],'era-ot24':['fan','Era OT24',pEra],mv:['fan','MV',pMV],'music-shows':['fan','Music Shows',pShows],variety:['fan','Variety Shows',pVariety],
 games:['game','Hub',pGames],'g-facts':['game','Member Facts',pFacts],'g-slide':['game','SlideSSS',pSlide],'g-match4':['game','Match 4',pM4],'g-finds':['game','Find S',pFind],'g-whowho':['game','Who Who',pWho],'g-mvquiz':['game','MV Quiz',pMVQ],'g-sorting':['game','Sorting SSS',pSort],'g-color':['game','Member Color',pColor],'g-song':['game','Song Quiz',pSong],'g-reveal':['game','Reveal',pReveal],photos:['game','Photos',pPhotos]};
function route(){stopTimer();Q=null;{const mo=$('#modal');if(mo&&!mo.hidden)closeModal()}const name=(location.hash||'').slice(1),key=R[name]?name:'home',r=R[key];
 $('#segFan').classList.toggle('on',r[0]==='fan');$('#segGames').classList.toggle('on',r[0]==='game');
 $('#sub').innerHTML=Object.keys(R).filter(k=>R[k][0]===r[0]).map(k=>`<a href="#${k}" class="${k===key?'on':''}">${R[k][1]}</a>`).join('');
 $('#view').innerHTML=r[2]();window.scrollTo(0,0)}

function closeModal(){const m=$('#modal');m.hidden=true;m.innerHTML=''}
function openModal(id,t){const m=$('#modal');m.hidden=false;
 m.innerHTML=`<div class="box" role="dialog" aria-modal="true" aria-label="${esc(t)}"><div class="bar"><b>${esc(t)}</b><button class="btn" data-close>Close</button></div><div class="vid"><iframe src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1&rel=0" title="${esc(t)}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div><div class="small">If the player says the video is unavailable, <a target="_blank" rel="noopener" href="https://www.youtube.com/watch?v=${id}">open it on YouTube</a>.</div></div>`;
 const c=$('#modal [data-close]');if(c)c.focus()}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
document.addEventListener('click',e=>{const t=e.target.closest('button,[data-f]');
 if(e.target.id==='modal'){closeModal();return}
 if(!t)return;
 if(t.dataset.play){openModal(t.dataset.play,t.dataset.t||'Music video');return}
 if(t.hasAttribute('data-close')){closeModal();return}
 if(t.dataset.f){MF.f=t.dataset.f;$$('#mchips .chip').forEach(c=>c.classList.toggle('on',c.dataset.f===MF.f));drawMembers();return}
 if(t.dataset.opt!=null&&Q&&Q.pick==null){const q=Q.qs[Q.i];Q.pick=+t.dataset.opt;if(Q.pick===q.c)Q.score++;drawQ();return}
 if(t.hasAttribute('data-next')&&Q){Q.i++;Q.pick=null;drawQ();return}
 if(t.hasAttribute('data-again')&&Q){startQuiz(Q.id,Q.gen);return}
 if(t.dataset.tile!=null&&SL){slMove(+t.dataset.tile);return}
 if(t.hasAttribute('data-slnew')){slInit();return}
 if(t.dataset.cand!=null&&MM&&!MM.over){const m=MM.pool[+t.dataset.cand];if(MM.cur.length<4&&!MM.cur.includes(m.n)){MM.cur.push(m.n);m4Draw()}return}
 if(t.dataset.slot!=null&&MM){MM.cur.splice(+t.dataset.slot,1);m4Draw();return}
 if(t.hasAttribute('data-m4go')&&MM&&MM.cur.length===4){const f=m4Fb(MM.cur,MM.secret);MM.hist.push({g:[...MM.cur],f});MM.cur=[];if(f.b===4){MM.over=true;MM.win=true}else if(MM.hist.length>=10)MM.over=true;m4Draw();return}
 if(t.hasAttribute('data-m4new')){m4Init();return}
 if(t.hasAttribute('data-fsgo')){fsStart();return}
 if(t.dataset.ft!=null&&FS&&FS.run){const m=FS.tiles[+t.dataset.ft];
  if(m===FS.target){FS.found++;FS.lvl++;fsWall();fsDraw()}else{FS.time-=3;const e2=$('#fsT');if(e2)e2.textContent=Math.max(0,Math.ceil(FS.time));t.classList.remove('bad');void t.offsetWidth;t.classList.add('bad');if(FS.time<=0)fsEnd()}return}
 if(t.hasAttribute('data-rvnext')&&RV){RV.i++;if(RV.i>=24)RV.done=true;RV.k=1;RV.msg='';RV.solved=false;RV.reveal=false;rvDraw();return}
 if(t.hasAttribute('data-rvnew')){rvInit();return}
 if(t.hasAttribute('data-phclear')){PH={};LS.set('sssPhotos',{});route();return}});
document.addEventListener('submit',e=>{if(e.target.id==='rvf'){e.preventDefault();rvGuess($('#rvin').value)}});
document.addEventListener('input',e=>{if(e.target.id==='mq'){MF.q=e.target.value;drawMembers()}});
document.addEventListener('change',e=>{const k=e.target.dataset&&e.target.dataset.ph;if(k&&e.target.files&&e.target.files[0])phSave(k,e.target.files[0])});
window.addEventListener('hashchange',route);
$('#spec').innerHTML=specHTML();
route();
</script>
